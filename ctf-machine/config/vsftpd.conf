listen=YES
listen_ipv6=NO

# 允許匿名登入（老師的失誤）
anonymous_enable=YES
anon_root=/srv/ftp
no_anon_password=YES
anon_upload_enable=NO
anon_mkdir_write_enable=NO

# 本機使用者
local_enable=YES
write_enable=NO

# 被動模式（Docker 必須設定）
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# 其他設定
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
idle_session_timeout=300
data_connection_timeout=120

# Docker 容器中必須關閉 seccomp sandbox
seccomp_sandbox=NO
